<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--surface2:#eef1f8;--text:#141826;--muted:#5d6579;
  --border:#dde2ee;--accent:#0b6bcb;--accent2:#00a3a3;--ok:#14883e;--okbg:#e5f6ec;
  --ko:#c4302b;--kobg:#fdeceb;--warn:#b26b00;--shadow:0 6px 24px rgba(20,30,60,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d111a;--surface:#161c28;--surface2:#1e2533;--text:#e8ecf4;--muted:#98a2b8;
  --border:#2a3243;--accent:#4da3ff;--accent2:#2dd4bf;--ok:#3ccf6e;--okbg:#12301f;
  --ko:#ff6b63;--kobg:#3a1716;--warn:#f0a73a;--shadow:0 6px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0d111a;--surface:#161c28;--surface2:#1e2533;--text:#e8ecf4;--muted:#98a2b8;
  --border:#2a3243;--accent:#4da3ff;--accent2:#2dd4bf;--ok:#3ccf6e;--okbg:#12301f;
  --ko:#ff6b63;--kobg:#3a1716;--warn:#f0a73a;--shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo span.dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:.9rem}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:1.7rem;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1rem;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p.sub{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--surface2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:7px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem;transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit;font-weight:600}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:13px 22px;border-radius:12px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.block{width:100%}
.mt{margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.9rem;gap:10px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--accent);margin-right:6px}
.tag.c{color:var(--accent2)}
.qtext{font-size:1.15rem;font-weight:600;margin:12px 0 4px}
.multi{color:var(--warn);font-size:.85rem;font-weight:600;margin-bottom:10px}
pre.code{font-family:"JetBrains Mono",monospace;font-size:.82rem;background:var(--surface2);padding:12px;border-radius:10px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--border);background:var(--surface);color:var(--text);padding:12px 14px;border-radius:12px;cursor:pointer;font:inherit;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.good .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.opt.bad .k{background:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border-left:4px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.ko{background:var(--kobg);border-color:var(--ko)}
.fb b{display:block;margin-bottom:4px}
.big{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;text-align:center}
.verdict{text-align:center;font-weight:700;margin-bottom:6px}
.themes{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:140px 1fr 50px;gap:10px;align-items:center;font-size:.9rem}
.tbar{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%}
.rev{border-top:1px solid var(--border);padding:12px 0}
.rev:first-child{border-top:0}
.rev .ans{color:var(--ok);font-size:.9rem;margin-top:4px}
.rev .yours{color:var(--ko);font-size:.9rem}
.kbd{color:var(--muted);font-size:.8rem;text-align:center;margin-top:12px}
.hide{display:none!important}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.trow{grid-template-columns:100px 1fr 44px}.big{font-size:2.6rem}h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><span class="dot">⌁</span>CCNA Trainer</div>
  <button class="iconbtn" id="themeBtn" title="Thème">◐</button>
</header>

<!-- ACCUEIL -->
<section id="home">
  <div class="card">
    <h1>Révise ton CCNA</h1>
    <p class="sub">CCNA 3 (ENSA) : OSPF, ACL, NAT, VPN, QoS, gestion, automatisation, et révisions CCNA 1 (ITN).</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><small>questions</small></div>
      <div class="stat"><b id="sBest">–</b><small>meilleur score</small></div>
      <div class="stat"><b id="sErr">0</b><small>erreurs à revoir</small></div>
    </div>
  </div>

  <div class="card">
    <h2>Cours</h2>
    <div class="chips" id="courseChips"></div>
    <h2 class="mt" style="margin-top:20px">Thèmes</h2>
    <div class="chips" id="themeChips"></div>
  </div>

  <div class="card">
    <h2>Mode</h2>
    <div class="seg" id="modeSeg">
      <button data-v="train" class="on">Entraînement</button>
      <button data-v="exam">Examen chronométré</button>
    </div>
    <p class="sub mt" id="modeDesc" style="font-size:.9rem"></p>
    <h2 style="margin-top:20px">Nombre de questions</h2>
    <div class="seg" id="countSeg">
      <button data-v="10" class="on">10</button>
      <button data-v="20">20</button>
      <button data-v="40">40</button>
      <button data-v="999">Toutes</button>
    </div>
    <button class="btn block mt" id="startBtn" style="margin-top:20px">Commencer</button>
    <button class="btn ghost block mt" id="errBtn">Revoir mes erreurs</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="hide">
  <div class="topbar"><span id="qCount"></span><span id="timer"></span><button class="iconbtn" id="quitBtn">Quitter</button></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <span class="tag c" id="qCourse"></span><span class="tag" id="qTheme"></span>
    <div class="qtext" id="qText"></div>
    <div id="qCode"></div>
    <div class="multi hide" id="qMulti"></div>
    <div class="opts" id="opts"></div>
    <div id="fb"></div>
    <button class="btn block mt" id="actBtn" disabled>Valider</button>
  </div>
  <div class="kbd">Clavier : 1–6 pour choisir · Entrée pour valider / continuer</div>
</section>

<!-- RÉSULTATS -->
<section id="result" class="hide">
  <div class="card">
    <div class="big" id="rScore"></div>
    <div class="verdict" id="rVerdict"></div>
    <p class="sub" style="text-align:center" id="rDetail"></p>
    <div class="row mt" style="justify-content:center;margin-top:18px">
      <button class="btn" id="againBtn">Rejouer</button>
      <button class="btn ghost" id="homeBtn">Accueil</button>
    </div>
  </div>
  <div class="card"><h2>Par thème</h2><div class="themes" id="rThemes"></div></div>
  <div class="card" id="rWrongCard"><h2>À corriger</h2><div id="rWrong"></div></div>
</section>
</div>

<script>
// [cours, thème, question, options, indices bonnes réponses, explication, code facultatif]
const RAW = [
// ===================== CCNA 3 – ENSA =====================
["ENSA","OSPF","Quelle est la distance administrative par défaut d’OSPF ?",["90","100","110","120"],[2],"OSPF = 110. EIGRP interne = 90, RIP = 120, route statique = 1, connectée = 0."],
["ENSA","OSPF","Dans quel ordre un routeur OSPF choisit-il son Router ID ?",["Loopback la plus haute → router-id → interface active la plus haute","router-id configuré → loopback la plus haute → interface active la plus haute","Interface active la plus haute → loopback → router-id","Adresse MAC la plus basse → router-id"],[1],"La commande router-id est prioritaire, puis l’IP de loopback la plus haute, puis l’IP d’interface physique active la plus haute."],
["ENSA","OSPF","Timers Hello / Dead par défaut d’OSPF sur un lien Ethernet ?",["5 s / 20 s","10 s / 40 s","30 s / 120 s","10 s / 30 s"],[1],"Broadcast et point-à-point : 10/40. NBMA : 30/120. Le Dead interval vaut 4 × Hello. Les timers doivent être identiques pour former une adjacence."],
["ENSA","OSPF","Un routeur a une priorité OSPF de 0 sur une interface. Conséquence ?",["Il devient forcément DR","Il devient BDR","Il ne peut être ni DR ni BDR","OSPF est désactivé sur l’interface"],[2],"Priorité 0 = exclu de l’élection DR/BDR. Il reste DROTHER mais continue à former des adjacences."],
["ENSA","OSPF","Comment est élu le DR sur un segment multiaccès ?",["Router ID le plus bas","Priorité la plus haute, puis Router ID le plus haut","Adresse IP d’interface la plus basse","Le premier routeur démarré, quelle que soit la priorité"],[1],"Priorité la plus haute (défaut 1), puis Router ID le plus haut en cas d’égalité. L’élection n’est pas préemptive : un nouveau routeur ne remplace pas le DR existant."],
["ENSA","OSPF","Avec la bande passante de référence par défaut, quel est le coût OSPF d’une interface GigabitEthernet ?",["1","10","100","0,1"],[0],"Coût = 100 Mbit/s ÷ bande passante. 100/1000 < 1, donc arrondi à 1, comme FastEthernet. D’où la commande auto-cost reference-bandwidth pour différencier les liens rapides."],
["ENSA","OSPF","Quel est l’effet de la commande passive-interface sur une interface OSPF ?",["Le réseau n’est plus annoncé","Les paquets Hello ne sont plus envoyés, mais le réseau reste annoncé","L’interface est désactivée","Le coût passe à 65535"],[1],"Passive-interface coupe l’envoi des Hello (pas d’adjacence possible) mais le réseau est toujours annoncé. On l’utilise sur les interfaces LAN côté utilisateurs."],
["ENSA","OSPF","Quel paquet OSPF contient la liste abrégée de la LSDB échangée lors de la synchronisation ?",["Hello","DBD","LSR","LSAck"],[1],"Les 5 types : Hello, DBD (Database Description), LSR (requête), LSU (mise à jour), LSAck (accusé)."],
["ENSA","OSPF","Sur un réseau multiaccès, quel état d’adjacence reste stable entre deux routeurs DROTHER ?",["FULL","2-WAY","EXSTART","LOADING"],[1],"Les DROTHER ne forment une adjacence FULL qu’avec le DR et le BDR. Entre eux, ils restent en 2-WAY."],
["ENSA","OSPF","Quelle commande permet de voir les voisins OSPF et leur état ?",["show ip route ospf","show ip ospf neighbor","show ip protocols","show ip ospf database"],[1],"show ip ospf neighbor affiche le Router ID voisin, la priorité, l’état (FULL/DR, 2WAY/DROTHER…) et l’interface."],
["ENSA","ACL","Quel masque générique correspond au réseau 192.168.10.0/26 ?",["0.0.0.31","0.0.0.63","0.0.0.127","255.255.255.192"],[1],"/26 = 255.255.255.192 → 255 − 192 = 63, donc 0.0.0.63."],
["ENSA","ACL","Quel mot-clé équivaut au masque générique 0.0.0.0 ?",["any","host","eq","all"],[1],"host 192.168.1.10 = 192.168.1.10 0.0.0.0. Et any = 0.0.0.0 255.255.255.255."],
["ENSA","ACL","Où doit-on placer une ACL standard ?",["Au plus près de la source","Au plus près de la destination","Uniquement sur le routeur de bordure","N’importe où"],[1],"Une ACL standard ne filtre que l’IP source. Placée près de la source, elle bloquerait l’accès à toutes les destinations."],
["ENSA","ACL","Où doit-on placer une ACL étendue ?",["Au plus près de la source","Au plus près de la destination","Sur le commutateur d’accès","Sur l’interface de loopback"],[0],"L’ACL étendue filtre précisément (source, destination, protocole, port). On la place près de la source pour éliminer le trafic indésirable au plus tôt."],
["ENSA","ACL","Que se passe-t-il pour un paquet qui ne correspond à aucune ligne d’une ACL ?",["Il est autorisé","Il est refusé (deny implicite)","Il est envoyé au CPU","Il est journalisé puis autorisé"],[1],"Chaque ACL se termine par un deny any implicite. Une ACL ne contenant que des deny bloque donc tout."],
["ENSA","ACL","Quelles plages de numéros correspondent aux ACL IPv4 étendues ? (2 réponses)",["1 à 99","100 à 199","1300 à 1999","2000 à 2699"],[1,3],"Standard : 1–99 et 1300–1999. Étendue : 100–199 et 2000–2699."],
["ENSA","ACL","Quelle commande applique une ACL pour restreindre l’accès SSH/Telnet aux lignes VTY ?",["ip access-group 10 in","access-class 10 in","ip access-list 10 vty","access-group vty 10"],[1],"Sur les lignes VTY, on utilise access-class. Sur une interface, on utilise ip access-group."],
["ENSA","ACL","Combien d’ACL peut-on appliquer au maximum sur une interface ?",["Une seule","Une par protocole et par direction","Deux par protocole","Illimité"],[1],"Règle des 3 P : une ACL par Protocole, par direction (in/out), par interface (Port)."],
["ENSA","ACL","Quelle ligne bloque le trafic Telnet du réseau 10.1.1.0/24 vers n’importe quelle destination ?",["access-list 10 deny tcp 10.1.1.0 0.0.0.255 any eq 23","access-list 110 deny tcp 10.1.1.0 0.0.0.255 any eq 23","access-list 110 deny udp 10.1.1.0 0.0.0.255 any eq 23","access-list 110 deny tcp any 10.1.1.0 0.0.0.255 eq 22"],[1],"Filtrer un port nécessite une ACL étendue (100–199). Telnet = TCP 23. SSH = TCP 22."],
["ENSA","NAT","En NAT, comment appelle-t-on l’adresse publique qui représente un hôte interne ?",["Inside local","Inside global","Outside local","Outside global"],[1],"Inside = l’hôte est chez nous. Local = vu de l’intérieur (privée), Global = vu de l’extérieur (publique)."],
["ENSA","NAT","Quel mot-clé active le PAT dans ip nat inside source ?",["translate","overload","port","extendable"],[1],"ip nat inside source list 1 interface g0/1 overload : plusieurs hôtes partagent une IP publique grâce aux numéros de port."],
["ENSA","NAT","Dans quel cas utilise-t-on une NAT statique ?",["Pour que des dizaines de PC accèdent à Internet","Pour qu’un serveur interne soit joignable depuis Internet avec une IP publique fixe","Pour économiser des adresses publiques","Pour traduire IPv4 en IPv6"],[1],"La NAT statique crée une correspondance 1:1 permanente, idéale pour un serveur web ou mail interne."],
["ENSA","NAT","Quel est un inconvénient de la NAT ?",["Elle augmente le nombre d’adresses publiques nécessaires","Elle complique la traçabilité de bout en bout et certaines applications (IPsec, VoIP)","Elle empêche le routage dynamique","Elle chiffre le trafic"],[1],"NAT casse la connectivité de bout en bout, ajoute de la latence et pose problème à certains protocoles qui transportent des IP dans leurs données."],
["ENSA","NAT","Quelle commande affiche les traductions NAT actives ?",["show ip nat statistics","show ip nat translations","show nat table","debug ip nat"],[1],"show ip nat translations liste les correspondances inside local / inside global. show ip nat statistics donne les compteurs."],
["ENSA","Sécurité","Une attaque qui sature une cible depuis de nombreuses machines compromises est :",["Une attaque par reconnaissance","Un DDoS","Un man-in-the-middle","Du phishing"],[1],"DDoS = déni de service distribué, souvent via un botnet."],
["ENSA","Sécurité","Lequel est un algorithme de chiffrement symétrique ?",["RSA","Diffie-Hellman","AES","SHA-256"],[2],"AES est symétrique (même clé). RSA est asymétrique, DH sert à l’échange de clés, SHA est une fonction de hachage."],
["ENSA","Sécurité","Quel élément garantit l’intégrité des données ?",["AES","Une fonction de hachage (SHA)","Le NAT","Diffie-Hellman"],[1],"Le hachage (SHA, MD5) produit une empreinte : toute modification des données change l’empreinte. Avec une clé, on obtient un HMAC qui authentifie aussi l’origine."],
["ENSA","Sécurité","Une attaque où l’attaquant inonde le commutateur de fausses adresses MAC pour qu’il diffuse tout le trafic s’appelle :",["ARP spoofing","MAC flooding (débordement de table CAM)","DHCP starvation","VLAN hopping"],[1],"Quand la table CAM est pleine, le switch agit comme un hub. Contre-mesure : port-security."],
["ENSA","WAN/VPN","Quel protocole IPsec assure à la fois chiffrement et authentification ?",["AH","ESP","GRE","IKE"],[1],"ESP chiffre et authentifie. AH authentifie seulement, sans chiffrer. IKE négocie les clés."],
["ENSA","WAN/VPN","Quelle caractéristique décrit un tunnel GRE ?",["Il chiffre le trafic","Il transporte le multicast et les protocoles de routage, mais sans chiffrement","Il ne fonctionne qu’en IPv6","Il remplace IPsec"],[1],"GRE encapsule tout type de trafic (multicast, OSPF…) mais n’est pas sécurisé. D’où GRE over IPsec."],
["ENSA","WAN/VPN","Un télétravailleur se connecte au réseau de l’entreprise via son navigateur en HTTPS. De quel type de VPN s’agit-il ?",["VPN site à site","VPN d’accès à distance SSL clientless","DMVPN","MPLS VPN"],[1],"Le VPN SSL sans client passe par le navigateur. Le VPN site à site relie deux réseaux via leurs passerelles."],
["ENSA","WAN/VPN","Quelle technologie WAN commute le trafic à l’aide d’étiquettes plutôt que d’adresses IP ?",["Frame Relay","MPLS","PPP","DSL"],[1],"MPLS ajoute un label et les routeurs commutent selon ce label. C’est rapide et supporte n’importe quel protocole."],
["ENSA","QoS","Quel mécanisme de file d’attente offre une file à priorité stricte pour la voix ?",["FIFO","WFQ","CBWFQ","LLQ"],[3],"LLQ = CBWFQ + file prioritaire stricte. La voix passe en premier, ce qui limite la latence et la gigue."],
["ENSA","QoS","Quelle valeur DSCP est recommandée pour la voix ?",["AF41","CS1","EF (46)","BE (0)"],[2],"EF (Expedited Forwarding) = DSCP 46 pour la voix. AF4x souvent pour la vidéo, CS1 pour le trafic moins prioritaire."],
["ENSA","QoS","Latence unidirectionnelle maximale recommandée pour la voix ?",["30 ms","150 ms","400 ms","1 s"],[1],"Voix : ≤ 150 ms de latence, ≤ 30 ms de gigue, ≤ 1 % de perte."],
["ENSA","QoS","Où placer idéalement la limite de confiance (trust boundary) ?",["Au cœur du réseau","Au plus près de la source, par exemple au téléphone IP ou au switch d’accès","Sur le routeur du FAI","Sur le pare-feu"],[1],"On marque et on fait confiance au plus près de la source pour que le marquage soit fiable dans tout le réseau."],
["ENSA","Gestion","Quelle version/niveau SNMP fournit authentification ET chiffrement ?",["SNMPv1","SNMPv2c","SNMPv3 authNoPriv","SNMPv3 authPriv"],[3],"authPriv = authentification + chiffrement. v1 et v2c utilisent des community strings en clair."],
["ENSA","Gestion","Quel niveau de gravité syslog correspond à « Warning » ?",["2","3","4","6"],[2],"0 Emergency, 1 Alert, 2 Critical, 3 Error, 4 Warning, 5 Notification, 6 Informational, 7 Debugging."],
["ENSA","Gestion","Que représente le stratum 0 en NTP ?",["Le serveur NTP de l’entreprise","Les horloges de référence (atomique, GPS)","Un client NTP","Une horloge non synchronisée"],[1],"Stratum 0 = source de référence. Stratum 1 = serveur directement relié. Plus le stratum est élevé, plus la source est éloignée."],
["ENSA","Gestion","Quelle est la différence principale entre CDP et LLDP ?",["CDP est de couche 3","LLDP est un standard ouvert (IEEE 802.1AB), CDP est propriétaire Cisco","LLDP ne fonctionne que sur la fibre","CDP est désactivé par défaut"],[1],"CDP est propriétaire Cisco et activé par défaut. LLDP est multi-constructeur et s’active avec lldp run."],
["ENSA","Conception","Quel est le rôle de la couche cœur (core) dans le modèle hiérarchique ?",["Connecter les utilisateurs finaux","Appliquer des ACL et des politiques","Assurer un transport à très haut débit entre les blocs, sans traitement lourd","Fournir le Wi-Fi"],[2],"Accès = utilisateurs. Distribution = politiques, routage inter-VLAN, ACL. Cœur = transport rapide et redondant."],
["ENSA","Conception","Quelle approche de dépannage commence par la couche physique ?",["Top-down","Bottom-up","Diviser pour régner","Suivre le chemin"],[1],"Bottom-up part de la couche 1 (câbles, voyants) et remonte. Idéal si on suspecte un problème physique."],

const Q = RAW.map((r,i)=>({id:i,course:r[0],theme:r[1],q:r[2],o:r[3],a:r[4],e:r[5],code:r[6]||""}));
const $ = s=>document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem("ccna_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ccna_"+k,JSON.stringify(v))}catch(e){}}
};
let errors = new Set(store.get("errors",[]));
let selCourses = new Set(["ENSA"]);
let selThemes = null; // null = tous
let mode="train", count=10;
let S=null, timerInt=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

// ---------- Thème clair/sombre ----------
const root=document.documentElement;
const savedTheme=store.get("theme",null); if(savedTheme) root.dataset.theme=savedTheme;
$("#themeBtn").onclick=()=>{
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark?"light":"dark"; store.set("theme",root.dataset.theme);
};

// ---------- Accueil ----------
function pool(){return Q.filter(q=>selCourses.has(q.course)&&(!selThemes||selThemes.has(q.course+"|"+q.theme)))}
function renderHome(){
  $("#sTotal").textContent=Q.length;
  const best=store.get("best",null); $("#sBest").textContent=best==null?"–":best+"%";
  $("#sErr").textContent=errors.size;
  $("#errBtn").disabled=errors.size===0;
  $("#errBtn").textContent=errors.size?`Revoir mes erreurs (${errors.size})`:"Aucune erreur à revoir";
  const cc=$("#courseChips"); cc.innerHTML="";
  [["ENSA","CCNA 3 · ENSA"],["ITN","CCNA 1 · ITN"]].forEach(([k,l])=>{
    const n=Q.filter(q=>q.course===k).length;
    const b=document.createElement("button"); b.className="chip"+(selCourses.has(k)?" on":"");
    b.innerHTML=`${l}<small>${n}</small>`;
    b.onclick=()=>{selCourses.has(k)?selCourses.delete(k):selCourses.add(k); if(!selCourses.size)selCourses.add(k); selThemes=null; renderHome()};
    cc.appendChild(b);
  });
  const tc=$("#themeChips"); tc.innerHTML="";
  const themes=[...new Set(Q.filter(q=>selCourses.has(q.course)).map(q=>q.course+"|"+q.theme))];
  const all=document.createElement("button"); all.className="chip"+(!selThemes?" on":""); all.textContent="Tous";
  all.onclick=()=>{selThemes=null;renderHome()}; tc.appendChild(all);
  themes.forEach(t=>{
    const [c,th]=t.split("|"); const n=Q.filter(q=>q.course===c&&q.theme===th).length;
    const b=document.createElement("button"); b.className="chip"+(selThemes&&selThemes.has(t)?" on":"");
    b.innerHTML=`${selCourses.size>1?c+" · ":""}${th}<small>${n}</small>`;
    b.onclick=()=>{ if(!selThemes)selThemes=new Set(); selThemes.has(t)?selThemes.delete(t):selThemes.add(t); if(!selThemes.size)selThemes=null; renderHome()};
    tc.appendChild(b);
  });
  $("#startBtn").textContent=`Commencer (${Math.min(count,pool().length)} questions)`;
  $("#modeDesc").textContent = mode==="train" ? "Correction et explication après chaque question." : "1 min 30 par question, correction à la fin, comme à l’examen.";
}
function seg(id,cb){document.querySelectorAll(id+" button").forEach(b=>b.onclick=()=>{document.querySelectorAll(id+" button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v);renderHome()})}
seg("#modeSeg",v=>mode=v); seg("#countSeg",v=>count=+v);

function show(id){["home","quiz","result"].forEach(s=>$("#"+s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}

// ---------- Quiz ----------
function start(list){
  S={list:list.map(q=>({...q,order:shuffle(q.o.map((_,i)=>i))})),i:0,res:[],mode,sel:new Set(),checked:false,end:null};
  if(mode==="exam"){S.end=Date.now()+S.list.length*90000; clearInterval(timerInt); timerInt=setInterval(tick,500); tick()} else {$("#timer").textContent=""}
  show("quiz"); renderQ();
}
function tick(){
  const left=Math.max(0,S.end-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  $("#timer").textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;
  if(left<=0){clearInterval(timerInt); while(S.res.length<S.list.length) S.res.push({q:S.list[S.res.length],pick:[],ok:false}); finish()}
}
function renderQ(){
  const q=S.list[S.i]; S.sel=new Set(); S.checked=false;
  $("#qCount").textContent=`Question ${S.i+1} / ${S.list.length}`;
  $("#prog").style.width=(S.i/S.list.length*100)+"%";
  $("#qCourse").textContent=q.course==="ENSA"?"CCNA 3":"CCNA 1"; $("#qTheme").textContent=q.theme;
  $("#qText").textContent=q.q;
  $("#qCode").innerHTML=q.code?`<pre class="code">${esc(q.code)}</pre>`:"";
  const multi=q.a.length>1; $("#qMulti").classList.toggle("hide",!multi); $("#qMulti").textContent=`Choisis ${q.a.length} réponses`;
  const box=$("#opts"); box.innerHTML="";
  q.order.forEach((oi,k)=>{
    const b=document.createElement("button"); b.className="opt"; b.dataset.oi=oi;
    b.innerHTML=`<span class="k">${String.fromCharCode(65+k)}</span><span>${esc(q.o[oi])}</span>`;
    b.onclick=()=>pick(oi); box.appendChild(b);
  });
  $("#fb").innerHTML=""; $("#actBtn").textContent=S.mode==="exam"&&S.i===S.list.length-1?"Terminer":"Valider"; $("#actBtn").disabled=true;
}
function pick(oi){
  if(S.checked)return; const q=S.list[S.i];
  if(q.a.length>1){S.sel.has(oi)?S.sel.delete(oi):S.sel.add(oi)} else {S.sel=new Set([oi])}
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",S.sel.has(+b.dataset.oi)));
  $("#actBtn").disabled = q.a.length>1 ? S.sel.size!==q.a.length : S.sel.size===0;
}
function act(){
  const q=S.list[S.i];
  if(S.checked){next();return}
  if($("#actBtn").disabled)return;
  const pickArr=[...S.sel]; const ok=pickArr.length===q.a.length&&pickArr.every(x=>q.a.includes(x));
  S.res.push({q,pick:pickArr,ok});
  if(ok) errors.delete(q.id); else errors.add(q.id);
  store.set("errors",[...errors]);
  if(S.mode==="exam"){next();return}
  S.checked=true;
  document.querySelectorAll(".opt").forEach(b=>{const oi=+b.dataset.oi;b.disabled=true;b.classList.remove("sel");
    if(q.a.includes(oi))b.classList.add("good"); else if(S.sel.has(oi))b.classList.add("bad")});
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"Bonne réponse !":"Mauvaise réponse"}</b>${esc(q.e)}</div>`;
  $("#actBtn").textContent=S.i===S.list.length-1?"Voir les résultats":"Question suivante";
  $("#actBtn").disabled=false;
}
function next(){ S.i++; if(S.i>=S.list.length) finish(); else renderQ() }
function finish(){
  clearInterval(timerInt);
  const n=S.res.length, good=S.res.filter(r=>r.ok).length, pct=n?Math.round(good/n*100):0;
  const best=store.get("best",null); if(best==null||pct>best) store.set("best",pct);
  $("#rScore").textContent=pct+"%"; $("#rScore").style.color=pct>=80?"var(--ok)":pct>=60?"var(--warn)":"var(--ko)";
  $("#rVerdict").textContent=pct>=80?"Niveau examen atteint 🎯":pct>=60?"Presque, encore un effort":"À retravailler";
  $("#rDetail").textContent=`${good} bonne(s) réponse(s) sur ${n}`;
  const by={}; S.res.forEach(r=>{const k=r.q.theme;by[k]=by[k]||{g:0,n:0};by[k].n++;if(r.ok)by[k].g++});
  $("#rThemes").innerHTML=Object.entries(by).sort((a,b)=>a[1].g/a[1].n-b[1].g/b[1].n).map(([k,v])=>{const p=Math.round(v.g/v.n*100);
    return `<div class="trow"><span>${k}</span><div class="tbar"><i style="width:${p}%;background:${p>=80?"var(--ok)":p>=60?"var(--warn)":"var(--ko)"}"></i></div><b>${v.g}/${v.n}</b></div>`}).join("");
  const wrong=S.res.filter(r=>!r.ok);
  $("#rWrongCard").classList.toggle("hide",!wrong.length);
  $("#rWrong").innerHTML=wrong.map(r=>`<div class="rev"><b>${esc(r.q.q)}</b>
    <div class="yours">Ta réponse : ${r.pick.length?r.pick.map(i=>esc(r.q.o[i])).join(" · "):"(aucune)"}</div>
    <div class="ans">✔ ${r.q.a.map(i=>esc(r.q.o[i])).join(" · ")}</div>
    <p class="sub" style="font-size:.88rem;margin-top:4px">${esc(r.q.e)}</p></div>`).join("");
  $("#prog").style.width="100%";
  show("result");
}

$("#actBtn").onclick=act;
$("#startBtn").onclick=()=>{const p=pool(); start(shuffle(p).slice(0,Math.min(count,p.length)))};
$("#errBtn").onclick=()=>{const l=Q.filter(q=>errors.has(q.id)); if(l.length) start(shuffle(l))};
$("#againBtn").onclick=()=>{mode=S.mode; start(shuffle(S.list.map(q=>Q[q.id])))};
$("#homeBtn").onclick=()=>{renderHome();show("home")};
$("#quitBtn").onclick=()=>{if(confirm("Quitter la session en cours ?")){clearInterval(timerInt);renderHome();show("home")}};
document.addEventListener("keydown",e=>{
  if($("#quiz").classList.contains("hide"))return;
  const n=parseInt(e.key); if(n>=1&&n<=6&&!S.checked){const b=document.querySelectorAll(".opt")[n-1]; if(b) pick(+b.dataset.oi)}
  if(e.key==="Enter"){e.preventDefault();act()}
});
renderHome();
</script>
</body>
</html>
