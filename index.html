    const questionElement = document.getElementById('question');
    const answerButtons = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const scoreElement = document.getElementById('score');
    const quizContainer = document.getElementById('quiz');
    const progressElement = document.getElementById('progress');

    let currentQuestionIndex = 0;
    let score = 0;
    let currentQuestion;

    function startQuiz() {
        questions.sort(() => Math.random() - 0.5); // Mélanger les questions
        currentQuestionIndex = 0;
        score = 0;
        scoreElement.innerHTML = `Score: 0`;
        showQuestion();
    }

    function showQuestion() {
        resetState();
        currentQuestion = questions[currentQuestionIndex];
        let questionNo = currentQuestionIndex + 1;
        
        let questionTitle = currentQuestion.question;
        if (currentQuestion.type === 'multiple') {
            questionTitle += ` (Choisissez-en ${currentQuestion.required})`;
        }

        questionElement.innerHTML = questionTitle;
        progressElement.innerHTML = `Question ${questionNo}/${questions.length}`;

        currentQuestion.answers.forEach(answer => {
            const li = document.createElement("li");
            li.innerHTML = answer.text;
            li.classList.add("answer-item");
            answerButtons.appendChild(li);
            if (answer.correct) {
                li.dataset.correct = "true";
            }
        });

        if (currentQuestion.type === 'multiple') {
            nextButton.innerHTML = `Valider`;
        } else {
            nextButton.innerHTML = `Question Suivante`;
        }
        
        answerButtons.addEventListener('click', selectAnswer);
    }

    function resetState() {
        nextButton.style.display = 'none';
        while (answerButtons.firstChild) {
            answerButtons.removeChild(answerButtons.firstChild);
        }
    }

    function selectAnswer(e) {
        if (!e.target.matches('.answer-item')) return;
        
        const selectedBtn = e.target;

        if (currentQuestion.type === 'single') {
            answerButtons.removeEventListener('click', selectAnswer);
            const isCorrect = selectedBtn.dataset.correct === "true";
            if (isCorrect) {
                selectedBtn.classList.add("correct");
                score++;
                scoreElement.innerHTML = `Score: ${score}`;
            } else {
                selectedBtn.classList.add("incorrect");
            }
            Array.from(answerButtons.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                }
                button.classList.add("disabled");
            });
            nextButton.style.display = "block";
        } else { // Multiple choice
            selectedBtn.classList.toggle('selected');
            if (answerButtons.querySelector('.selected')) {
                nextButton.style.display = 'block';
            } else {
                nextButton.style.display = 'none';
            }
        }
    }
    
    function checkMultipleAnswers() {
        answerButtons.removeEventListener('click', selectAnswer);
        const selectedNodes = answerButtons.querySelectorAll('.selected');
        let correctSelections = 0;
        let isPerfect = true;

        Array.from(answerButtons.children).forEach(button => {
            const isCorrect = button.dataset.correct === "true";
            const isSelected = button.classList.contains('selected');
            
            if (isSelected) {
                if (isCorrect) {
                    button.classList.add("correct");
                    correctSelections++;
                } else {
                    button.classList.add("incorrect");
                    isPerfect = false;
                }
            } else {
                if(isCorrect) {
                   isPerfect = false; 
                }
            }
            button.classList.add("disabled");
        });

        if (isPerfect && correctSelections === currentQuestion.required) {
            score++;
            scoreElement.innerHTML = `Score: ${score}`;
        }
        
        // Show correct answers
        Array.from(answerButtons.children).forEach(button => {
           if (button.dataset.correct === "true") {
               button.classList.add("correct");
           }
        });

        nextButton.innerHTML = "Question Suivante";
    }

    function showScore() {
        quizContainer.innerHTML = `
            <div class="result-screen">
                <h2>Quiz Terminé !</h2>
                <p>Votre score final est de ${score} sur ${questions.length}.</p>
                <button onclick="location.reload()" class="restart-btn">Recommencer le Quiz</button>
            </div>
        `;
    }

    function handleNextButton() {
        if (currentQuestion.type === 'multiple' && nextButton.innerHTML === 'Valider') {
            checkMultipleAnswers();
        } else {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }
    }

    nextButton.addEventListener('click', handleNextButton);

    startQuiz();
